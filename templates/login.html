{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<style>
    body {
        overflow: hidden !important;
    }
</style>

<!-- Декоративные круги на фоне -->
<div class="floating-circle floating-circle-1"></div>
<div class="floating-circle floating-circle-2"></div>
<div class="floating-circle floating-circle-3"></div>

<div class="login-page">
    <div class="login-card">
        <div class="card-header">
            <i class="fas fa-balance-scale"></i> Юридическая фирма
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-4">
                    <label for="username" class="form-label">
                        <i class="fas fa-user-circle"></i> Логин
                    </label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Введите ваш логин" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="fas fa-key"></i> Пароль
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Введите ваш пароль" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Войти в систему
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                <strong><i class="fas fa-info-circle"></i> Тестовые учётные данные:</strong><br><br>
                <i class="fas fa-user-shield"></i> <strong>Администратор:</strong> admin / admin123<br>
                <i class="fas fa-user-cog"></i> <strong>Менеджер:</strong> manager1 / manager123<br>
                <i class="fas fa-user-graduate"></i> <strong>Юрист:</strong> lawyer1 / lawyer123
            </small>
        </div>
    </div>
</div>
{% endblock %}
